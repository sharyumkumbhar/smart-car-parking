<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Parking - Operator Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin: 7px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #172554;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 15px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .register-btn {
            background: #16a34a;
            color: white;
            margin-top: 18px;
            width: 100%;
        }

        .release-btn {
            background: #dc2626;
            color: white;
        }

        .command-btn {
            background: #2563eb;
            color: white;
        }

        .sms-btn {
            background: #7c3aed;
            color: white;
        }

        .refresh-btn {
            background: #475569;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .message {
            padding: 12px;
            margin-top: 15px;
            border-radius: 7px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .slots {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .slot {
            padding: 18px 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .slot.available {
            background: #dcfce7;
            color: #166534;
            border: 2px solid #22c55e;
        }

        .slot.occupied {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .vehicle {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .vehicle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status {
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.occupied {
            background: #fee2e2;
            color: #991b1b;
        }

        .status.available {
            background: #dcfce7;
            color: #166534;
        }

        .vehicle-info {
            margin-top: 10px;
            line-height: 1.7;
        }

        .countdown {
            font-size: 18px;
            font-weight: bold;
            color: #b45309;
        }

        .command-box {
            background: #111827;
            color: #22c55e;
            padding: 12px;
            border-radius: 7px;
            margin-top: 10px;
            word-break: break-all;
            font-family: monospace;
            display: none;
        }

        .notification {
            border-left: 5px solid #2563eb;
            background: #eff6ff;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 7px;
        }

        .notification small {
            color: #64748b;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .slots {
                grid-template-columns: repeat(2, 1fr);
            }

        }

    </style>

</head>

</header>


<div class="container">

// =======================================================
// REGISTER VEHICLE
// =======================================================

async function registerVehicle() {


    const qr_id =
        document
        .getElementById("qr_id")
        .value
        .trim();


    const owner_name =
        document
        .getElementById("owner_name")
        .value
        .trim();


    const car_number =
        document
        .getElementById("car_number")
        .value
        .trim();


    const phone_number =
        document
        .getElementById("phone_number")
        .value
        .trim();


    const parking_time =
        Number(
            document
            .getElementById("parking_time")
            .value
        );


    const slot_number =
        Number(
            document
            .getElementById("slot_number")
            .value
        );


    const status =
        document
        .getElementById("status")
        .value
        .trim();


    const message =
        document
        .getElementById("registerMessage");



    // ===================================================
    // VALIDATION
    // ===================================================

    if (!qr_id) {

        showMessage(
            message,
            "Please enter QR ID.",
            false
        );

        return;
    }


    if (!owner_name) {

        showMessage(
            message,
            "Please enter owner name.",
            false
        );

        return;
    }


    if (!car_number) {

        showMessage(
            message,
            "Please enter car number.",
            false
        );

        return;
    }


    if (!phone_number) {

        showMessage(
            message,
            "Please enter phone number.",
            false
        );

        return;
    }


    if (!parking_time || parking_time <= 0) {

        showMessage(
            message,
            "Please enter valid parking time.",
            false
        );

        return;
    }


    if (
        !slot_number ||
        slot_number < 1 ||
        slot_number > 5
    ) {

        showMessage(
            message,
            "Please select a valid slot.",
            false
        );

        return;
    }



    try {


        // ===============================================
        // CHECK DUPLICATE QR
        // ===============================================

        const {
            data: qrData,
            error: qrError
        } = await db
            .from("cars")
            .select("QR_ID")
            .eq("QR_ID", qr_id);


        if (qrError) {

            throw qrError;

        }


        if (
            qrData &&
            qrData.length > 0
        ) {

            showMessage(
                message,
                "This QR ID is already registered.",
                false
            );

            return;
        }



        // ===============================================
        // CHECK SLOT
        // ===============================================

        const {
            data: slotData,
            error: slotError
        } = await db
            .from("cars")
            .select("QR_ID,CAR_NUMBER")
            .eq(
                "SLOT_NUMBER",
                slot_number
            )
            .eq(
                "STATUS",
                "OCCUPIED"
            );


        if (slotError) {

            throw slotError;

        }


        if (
            slotData &&
            slotData.length > 0
        ) {

            showMessage(
                message,
                "This slot is already occupied.",
                false
            );

            return;
        }



        // ===============================================
        // PARKING TIME
        // ===============================================

        const parking_start =
            new Date();


        // Real parking time
        const parking_end =
            new Date(
                parking_start.getTime() +
                parking_time *
                60 *
                1000
            );



        // ===============================================
        // INSERT
        // ===============================================

        const {
            error
        } = await db
            .from("cars")
            .insert({

                QR_ID:
                    qr_id,

                OWNER_NAME:
                    owner_name,

                CAR_NUMBER:
                    car_number,

                PHONE_NUMBER:
                    phone_number,

                PARKING_TIME:
                    parking_time,

                STATUS:
                    status,

                PARK:
                    "YES",

                parking_start:
                    parking_start.toISOString(),

                parking_end:
                    parking_end.toISOString(),

                SLOT_NUMBER:
                    slot_number

            });


        if (error) {

            throw error;

        }



        // ===============================================
        // SUCCESS
        // ===============================================

        showMessage(
            message,
            "Vehicle registered successfully!",
            true
        );


        // Clear form

        document
            .getElementById("qr_id")
            .value = "";

        document
            .getElementById("owner_name")
            .value = "";

        document
            .getElementById("car_number")
            .value = "";

        document
            .getElementById("phone_number")
            .value = "";

        document
            .getElementById("parking_time")
            .value = "";

        document
            .getElementById("slot_number")
            .value = "";



        // ===============================================
        // CREATE ARDUINO COMMAND
        // ===============================================

        const arduinoCommand =
            `ALLOT,${qr_id},${slot_number},${parking_time},${phone_number},${car_number}`;


        // Show command

        alert(
            "Vehicle registered!\n\n" +
            "Send this command to Arduino:\n\n" +
            arduinoCommand
        );


        await loadVehicles();

        await loadSlots();

    }

    catch (error) {

        console.error(error);


        showMessage(
            message,
            "Error: " +
            error.message,
            false
        );

    }

}



// =======================================================
// RELEASE VEHICLE
// =======================================================

async function releaseVehicle(
    id,
    slotNumber,
    carNumber
) {


    const confirmRelease =
        confirm(
            `Release Slot ${slotNumber}?\n\nCar: ${carNumber}`
        );


    if (!confirmRelease) {

        return;

    }


    try {


        // ===============================================
        // UPDATE DATABASE
        // ===============================================

        const {
            error
        } = await db
            .from("cars")
            .update({

                STATUS:
                    "AVAILABLE",

                PARK:
                    "NO",

                parking_end:
                    new Date().toISOString()

            })
            .eq(
                "id",
                id
            );


        if (error) {

            throw error;

        }



        // ===============================================
        // ARDUINO COMMAND
        // ===============================================

        const command =
            `RELEASE,${slotNumber}`;


        // ===============================================
        // SHOW COMMAND
        // ===============================================

        alert(
            "Slot released successfully!\n\n" +
            "Send this command to Arduino through Bluetooth:\n\n" +
            command
        );


        await loadVehicles();

        await loadSlots();

    }

    catch (error) {

        console.error(error);

        alert(
            "Release error: " +
            error.message
        );

    }

}



// =======================================================
// CREATE ARDUINO ALLOT COMMAND
// =======================================================

function createArduinoCommand(
    vehicle
) {


    const command =
        `ALLOT,${vehicle.QR_ID},${vehicle.SLOT_NUMBER},${vehicle.PARKING_TIME},${vehicle.PHONE_NUMBER},${vehicle.CAR_NUMBER}`;


    showCommand(
        "command-" + vehicle.id,
        command
    );

}



// =======================================================
// CREATE RELEASE COMMAND
// =======================================================

function createReleaseCommand(
    vehicle
) {


    const command =
        `RELEASE,${vehicle.SLOT_NUMBER}`;


    showCommand(
        "command-" + vehicle.id,
        command
    );

}



// =======================================================
// CREATE SMS COMMAND
// =======================================================

function createExpirySMSCommand(
    vehicle
) {


    const message =
        `Your parking time for car ${vehicle.CAR_NUMBER} is about to expire, please move your car or contact the parking office.`;


    const command =
        `SMS|${vehicle.PHONE_NUMBER}|${message}`;


    showCommand(
        "sms-" + vehicle.id,
        command
    );

}



// =======================================================
// SHOW COMMAND
// =======================================================

function showCommand(
    elementId,
    command
) {


    const element =
        document
        .getElementById(elementId);


    element.style.display =
        "block";


    element.textContent =
        command;


    // Copy command

    navigator.clipboard
        .writeText(command)
        .then(() => {

            alert(
                "Command copied!\n\n" +
                command
            );

        })
        .catch(() => {

            alert(
                "Command:\n\n" +
                command
            );

        });

}



// =======================================================
// LOAD VEHICLES
// =======================================================

async function loadVehicles() {


    const list =
        document
        .getElementById("vehicleList");


    list.innerHTML =
        "Loading...";


    try {


        const {
            data,
            error
        } = await db
            .from("cars")
            .select(`
                id,
                QR_ID,
                OWNER_NAME,
                CAR_NUMBER,
                PHONE_NUMBER,
                PARKING_TIME,
                STATUS,
                PARK,
                parking_start,
                parking_end,
                SLOT_NUMBER
            `)
            .order(
                "id",
                {
                    ascending: false
                }
            );


        if (error) {

            throw error;

        }


        if (
            !data ||
            data.length === 0
        ) {

            list.innerHTML =
                `<div class="empty">
                    No vehicles registered.
                </div>`;

            return;

        }


        list.innerHTML =
            "";


        data.forEach(
            vehicle => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "vehicle";


                const occupied =
                    vehicle.STATUS ===
                    "OCCUPIED";


                div.innerHTML = `

                    <div class="vehicle-header">

                        <strong>
                            🚗 ${vehicle.CAR_NUMBER}
                        </strong>

                        <span class="status ${
                            occupied
                            ? "occupied"
                            : "available"
                        }">

                            ${
                                vehicle.STATUS
                            }

                        </span>

                    </div>


                    <div class="vehicle-info">

                        <b>QR ID:</b>
                        ${vehicle.QR_ID}
                        <br>

                        <b>Owner:</b>
                        ${vehicle.OWNER_NAME}
                        <br>

                        <b>Phone:</b>
                        ${vehicle.PHONE_NUMBER}
                        <br>

                        <b>Slot:</b>
                        ${vehicle.SLOT_NUMBER}
                        <br>

                        <b>Parking Time:</b>
                        ${vehicle.PARKING_TIME} minutes

                        <br><br>

                        ${
                            occupied
                            ?
                            `<div
                                class="countdown"
                                id="timer-${vehicle.id}">
                                Calculating...
                            </div>`
                            :
                            `<b>
                                Parking completed/released.
                            </b>`
                        }

                    </div>


                    <div class="actions">

                        ${
                            occupied
                            ?
                            `
                            <button
                                class="release-btn"
                                onclick="releaseVehicle(
                                    ${vehicle.id},
                                    ${vehicle.SLOT_NUMBER},
                                    '${escapeJS(vehicle.CAR_NUMBER)}'
                                )">

                                🔓 Release Slot

                            </button>
                            `
                            :
                            ""
                        }


                        ${
                            occupied
                            ?
                            `
                            <button
                                class="command-btn"
                                onclick='createArduinoCommand(
                                    ${JSON.stringify(vehicle)}
                                )'>

                                📡 Allot Command

                            </button>
                            `
                            :
                            ""
                        }


                        ${
                            occupied
                            ?
                            `
                            <button
                                class="sms-btn"
                                onclick='createExpirySMSCommand(
                                    ${JSON.stringify(vehicle)}
                                )'>

                                📱 Create Expiry SMS

                            </button>
                            `
                            :
                            ""
                        }

                    </div>


                    <div
                        id="command-${vehicle.id}"
                        class="command-box">
                    </div>


                    <div
                        id="sms-${vehicle.id}"
                        class="command-box">
                    </div>

                `;


                list.appendChild(
                    div
                );


                if (occupied) {

                    updateCountdown(
                        vehicle
                    );

                }

            }
        );

    }

    catch (error) {

        console.error(error);

        list.innerHTML =
            `<div class="error"
                  style="display:block">

                Error loading vehicles:
                ${error.message}

            </div>`;

    }

}



// =======================================================
// COUNTDOWN
// =======================================================

function updateCountdown(
    vehicle
) {


    const element =
        document
        .getElementById(
            "timer-" +
            vehicle.id
        );


    if (!element) {

        return;

    }


    if (!vehicle.parking_end) {

        element.textContent =
            "No expiry time";

        return;

    }


    const end =
        new Date(
            vehicle.parking_end
        ).getTime();


    const now =
        new Date().getTime();


    const difference =
        end - now;


    if (difference <= 0) {

        element.textContent =
            "⏰ PARKING TIME EXPIRED";

        element.style.color =
            "#dc2626";

        return;

    }


    const totalSeconds =
        Math.floor(
            difference / 1000
        );


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    element.textContent =
        `⏱️ Time remaining: ${minutes}m ${seconds}s`;

}

// =======================================================
// LOAD SLOT STATUS
// =======================================================

async function loadSlots() {


    const container =
        document
        .getElementById(
            "slotContainer"
        );


    container.innerHTML =
        "";


    try {


        const {
            data,
            error
        } = await db
            .from("cars")
            .select(
                "SLOT_NUMBER,STATUS,CAR_NUMBER"
            );


        if (error) {

            throw error;

        }


        for (
            let slot = 1;
            slot <= 5;
            slot++
        ) {


            const vehicle =
                data.find(
                    item =>
                        Number(
                            item.SLOT_NUMBER
                        ) === slot &&
                        item.STATUS ===
                        "OCCUPIED"
                );


            const occupied =
                !!vehicle;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                occupied
                ? "slot occupied"
                : "slot available";


            div.innerHTML =
                occupied
                ?
                `
                    🔴 Slot ${slot}
                    <br>
                    OCCUPIED
                    <br>
                    <small>
                        ${vehicle.CAR_NUMBER}
                    </small>
                `
                :
                `
                    🟢 Slot ${slot}
                    <br>
                    AVAILABLE
                `;


            container.appendChild(
                div
            );

        }

    }

    catch (error) {

        console.error(error);

        container.innerHTML =
            `<div class="error"
                  style="display:block">

                Error loading slots:
                ${error.message}

            </div>`;

    }

}

        if (error) {

        if (

            list.innerHTML =
                `<div class="empty">
                    No notifications.
                </div>`;

            return;

        }


        list.innerHTML =
            "";


        data.forEach(
            notification => {


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "notification";


                const date =
                    new Date(
                        notification.created_at
                    );


                div.innerHTML = `

                    <strong>
                        🔔 Parking Office Notification
                    </strong>

                    <br><br>

                    <b>QR ID:</b>
                    ${notification.qr_id}

                    <br>

                    <b>Car:</b>
                    ${notification.car_number}

                    <br>

                    <b>Message:</b>
                    ${notification.message}

                    <br>

                    <b>Status:</b>
                    ${notification.status}

                    <br>

                    <small>
                        ${date.toLocaleString()}
                    </small>

                `;


                list.appendChild(
                    div
                );

            }
        );

    }

    catch (error) {

        console.error(error);

        list.innerHTML =
            `<div class="error"
                  style="display:block">

                Error loading notifications:
                ${error.message}

            </div>`;

    }

}



// =======================================================
// SHOW MESSAGE
// =======================================================

function showMessage(
    element,
    text,
    success
) {


    element.textContent =
        text;


    element.className =
        "message " +
        (
            success
            ? "success"
            : "error"
        );


    element.style.display =
        "block";

}



// =======================================================
// ESCAPE TEXT FOR JAVASCRIPT
// =======================================================

function escapeJS(
    text
) {

    return String(text)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /\n/g,
            "\\n"
        )
        .replace(
            /\r/g,
            "\\r"
        );

}



// =======================================================
// AUTO REFRESH
// =======================================================

// Vehicles every 10 seconds

setInterval(
    loadVehicles,
    10000
);


// Slots every 5 seconds

setInterval(
    loadSlots,
    5000
);


// Notifications every 5 seconds

setInterval(
    loadNotifications,
    5000
);



// =======================================================
// INITIAL LOAD
// =======================================================

loadVehicles();

loadSlots();

loadNotifications();


</script>
