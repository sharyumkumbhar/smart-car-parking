<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Parking Operator Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

header {
    background: #172b4d;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
    color: #172b4d;
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 7px;
    font-size: 16px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 7px;
    padding: 13px;
    font-size: 16px;
    font-weight: bold;
}

.register-btn {
    width: 100%;
    margin-top: 18px;
    background: #198754;
    color: white;
}

.register-btn:disabled {
    background: #777;
    cursor: not-allowed;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 7px;
    font-weight: bold;
}

.success {
    display: block;
    background: #d1e7dd;
    color: #0f5132;
}

.error {
    display: block;
    background: #f8d7da;
    color: #842029;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 750px;
    border-collapse: collapse;
}

th {
    background: #172b4d;
    color: white;
    padding: 12px;
}

td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

.occupied {
    color: #dc3545;
    font-weight: bold;
}

.available {
    color: #198754;
    font-weight: bold;
}

.expired {
    color: #dc3545;
    font-weight: bold;
}

.notification-new {
    background: #fff3cd;
}

.small {
    color: #666;
    font-size: 13px;
    margin-top: 5px;
}

@media(max-width:700px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🚗 Smart Car Parking Operator Dashboard</h1>
</header>

<div class="container">

<!-- =========================
     REGISTER VEHICLE
========================= -->

<div class="card">

<h2>🚘 Register Vehicle</h2>

<div class="form-grid">

<div>
<label for="qr_id">QR ID</label>
<input
    type="text"
    id="qr_id"
    placeholder="Example: QR001">
</div>

<div>
<label for="owner_name">Owner Name</label>
<input
    type="text"
    id="owner_name"
    placeholder="Owner name">
</div>

<div>
<label for="car_number">Car Number</label>
<input
    type="text"
    id="car_number"
    placeholder="Example: GA01AB1234">
</div>

<div>
<label for="phone_number">Phone Number</label>
<input
    type="text"
    id="phone_number"
    placeholder="Example: +919876543210">
</div>

<div>
<label for="parking_time">Parking Time</label>
<input
    type="number"
    id="parking_time"
    min="1"
    placeholder="Example: 10">

<div class="small">
Demo: 1 entered minute = 1 real second
</div>
</div>

<div>
<label for="slot_number">Slot Number</label>

<select id="slot_number">
    <option value="">Select Slot</option>
    <option value="1">Slot 1</option>
    <option value="2">Slot 2</option>
    <option value="3">Slot 3</option>
    <option value="4">Slot 4</option>
    <option value="5">Slot 5</option>
</select>
</div>

<div>
<label for="status">Status</label>

<select id="status">
    <option value="OCCUPIED">OCCUPIED</option>
    <option value="AVAILABLE">AVAILABLE</option>
</select>
</div>

</div>

<button
    type="button"
    id="registerButton"
    class="register-btn"
    onclick="registerVehicle()">

    🚗 Register Vehicle

</button>

<div id="message" class="message"></div>

</div>


<!-- =========================
     REGISTERED VEHICLES
========================= -->

<div class="card">

<h2>📋 Registered Vehicles</h2>

<div class="table-container">

<table>

<thead>
<tr>
<th>QR ID</th>
<th>Owner</th>
<th>Car Number</th>
<th>Slot</th>
<th>Status</th>
<th>Remaining Time</th>
</tr>
</thead>

<tbody id="vehiclesTableBody">

<tr>
<td colspan="6">
Loading vehicles...
</td>
</tr>

</tbody>

</table>

</div>

</div>


<!-- =========================
     LIVE NOTIFICATIONS
========================= -->

<div class="card">

<h2>🔔 Live Notifications</h2>

<div class="table-container">

<table>

<thead>
<tr>
<th>ID</th>
<th>QR ID</th>
<th>Car Number</th>
<th>Message</th>
<th>Status</th>
<th>Time</th>
</tr>
</thead>

<tbody id="notificationsTableBody">

<tr>
<td colspan="6">
Loading notifications...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://yokdshtjbjlhqmmrnpxh.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_2ZDoGT6xIclKRzqbE78Vnw_Uwp7BRdK";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   PAGE START
===================================================== */

window.addEventListener("DOMContentLoaded", function() {

    console.log("Dashboard loaded");

    loadVehicles();

    loadNotifications();

    setInterval(loadVehicles, 1000);

    setInterval(loadNotifications, 2000);

});


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =====================================================
   REGISTER VEHICLE
===================================================== */

async function registerVehicle() {

    console.log("REGISTER BUTTON CLICKED");


    /* GET ELEMENTS */

    const qrElement =
        document.getElementById("qr_id");

    const ownerElement =
        document.getElementById("owner_name");

    const carElement =
        document.getElementById("car_number");

    const phoneElement =
        document.getElementById("phone_number");

    const timeElement =
        document.getElementById("parking_time");

    const slotElement =
        document.getElementById("slot_number");

    const statusElement =
        document.getElementById("status");


    /* CHECK ELEMENTS */

    if (
        !qrElement ||
        !ownerElement ||
        !carElement ||
        !phoneElement ||
        !timeElement ||
        !slotElement ||
        !statusElement
    ) {

        alert(
            "❌ Form elements not found."
        );

        return;
    }


    /* READ VALUES */

    const qr_id =
        qrElement.value.trim();

    const owner_name =
        ownerElement.value.trim();

    const car_number =
        carElement.value.trim();

    const phone_number =
        phoneElement.value.trim();

    const parking_time =
        Number(timeElement.value);

    const slot_number =
        Number(slotElement.value);

    const status =
        statusElement.value;


    console.log("QR ID:", qr_id);
    console.log("Owner:", owner_name);
    console.log("Car:", car_number);
    console.log("Phone:", phone_number);
    console.log("Parking:", parking_time);
    console.log("Slot:", slot_number);
    console.log("Status:", status);


    /* =================================================
       VALIDATION
    ================================================= */

    if (qr_id === "") {
        showMessage("❌ Enter QR ID", "error");
        qrElement.focus();
        return;
    }

    if (owner_name === "") {
        showMessage("❌ Enter Owner Name", "error");
        ownerElement.focus();
        return;
    }

    if (car_number === "") {
        showMessage("❌ Enter Car Number", "error");
        carElement.focus();
        return;
    }

    if (phone_number === "") {
        showMessage("❌ Enter Phone Number", "error");
        phoneElement.focus();
        return;
    }

    if (
        !Number.isFinite(parking_time) ||
        parking_time <= 0
    ) {
        showMessage(
            "❌ Enter valid Parking Time",
            "error"
        );
        timeElement.focus();
        return;
    }

    if (
        !Number.isInteger(slot_number) ||
        slot_number < 1 ||
        slot_number > 5
    ) {
        showMessage(
            "❌ Select a valid Slot",
            "error"
        );
        slotElement.focus();
        return;
    }


    /* =================================================
       CHECK QR
    ================================================= */

    console.log("Checking QR ID...");

    const qrCheck =
        await db
        .from("cars")
        .select("qr_id")
        .eq("qr_id", qr_id)
        .limit(1);


    if (qrCheck.error) {

        console.error(
            "QR CHECK ERROR:",
            qrCheck.error
        );

        showMessage(
            "❌ Database Error: " +
            qrCheck.error.message,
            "error"
        );

        return;
    }


    if (
        qrCheck.data &&
        qrCheck.data.length > 0
    ) {

        showMessage(
            "❌ QR ID already registered.",
            "error"
        );

        return;
    }


    /* =================================================
       CHECK SLOT
    ================================================= */

    console.log("Checking slot...");

    const slotCheck =
        await db
        .from("cars")
        .select("qr_id,car_number")
        .eq("slot_number", slot_number)
        .eq("status", "OCCUPIED")
        .limit(1);


    if (slotCheck.error) {

        console.error(
            "SLOT CHECK ERROR:",
            slotCheck.error
        );

        showMessage(
            "❌ Slot check error: " +
            slotCheck.error.message,
            "error"
        );

        return;
    }


    if (
        slotCheck.data &&
        slotCheck.data.length > 0
    ) {

        showMessage(
            "❌ Slot " +
            slot_number +
            " is already occupied.",
            "error"
        );

        return;
    }


    /* =================================================
       PARKING TIME
    ================================================= */

    const parking_start =
        new Date();

    /*
       DEMO MODE:
       1 minute = 1 second
    */

    const parking_end =
        new Date(
            parking_start.getTime() +
            parking_time * 1000
        );


    /* =================================================
       VEHICLE DATA
    ================================================= */

    const vehicleData = {

        qr_id: qr_id,

        owner_name: owner_name,

        car_number: car_number,

        phone_number: phone_number,

        parking_time: parking_time,

        status: status,

        slot_number: slot_number,

        parking_start:
            parking_start.toISOString(),

        parking_end:
            parking_end.toISOString()

    };


    console.log(
        "VEHICLE DATA:",
        vehicleData
    );


    /* =================================================
       BUTTON
    ================================================= */

    const registerButton =
        document.getElementById(
            "registerButton"
        );

    registerButton.disabled = true;

    registerButton.textContent =
        "⏳ Registering...";


    /* =================================================
       INSERT
    ================================================= */

    console.log(
        "Sending vehicle to database..."
    );


    const insertResult =
        await db
        .from("cars")
        .insert([vehicleData]);


    registerButton.disabled = false;

    registerButton.textContent =
        "🚗 Register Vehicle";


    /* =================================================
       ERROR
    ================================================= */

    if (insertResult.error) {

        console.error(
            "INSERT ERROR:",
            insertResult.error
        );

        showMessage(
            "❌ Registration failed: " +
            insertResult.error.message,
            "error"
        );

        return;
    }


    /* =================================================
       SUCCESS
    ================================================= */

    console.log(
        "VEHICLE REGISTERED SUCCESSFULLY"
    );

    showMessage(
        "✅ Vehicle registered successfully!",
        "success"
    );


    /* CLEAR */

    qrElement.value = "";

    ownerElement.value = "";

    carElement.value = "";

    phoneElement.value = "";

    timeElement.value = "";

    slotElement.value = "";

    statusElement.value =
        "OCCUPIED";


    /* REFRESH */

    loadVehicles();

}


/* =====================================================
   LOAD VEHICLES
===================================================== */

async function loadVehicles() {

    const table =
        document.getElementById(
            "vehiclesTableBody"
        );


    const result =
        await db
        .from("cars")
        .select(
            "qr_id,owner_name,car_number,status,slot_number,parking_end"
        );


    if (result.error) {

        console.error(
            "LOAD VEHICLES ERROR:",
            result.error
        );

        table.innerHTML = `
            <tr>
                <td colspan="6">
                    ❌ ${escapeHTML(
                        result.error.message
                    )}
                </td>
            </tr>
        `;

        return;
    }


    const vehicles =
        result.data || [];


    if (vehicles.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="6">
                    No registered vehicles.
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML = "";


    vehicles.forEach(function(vehicle) {

        let remaining = "--";

        let timeClass = "";


        if (
            vehicle.status === "OCCUPIED" &&
            vehicle.parking_end
        ) {

            const end =
                new Date(
                    vehicle.parking_end
                ).getTime();

            const now =
                Date.now();

            const difference =
                end - now;

            let seconds =
                Math.ceil(
                    difference / 1000
                );


            if (seconds <= 0) {

                remaining = "00:00";

                timeClass = "expired";

            } else {

                const minutes =
                    Math.floor(
                        seconds / 60
                    );

                const secs =
                    seconds % 60;


                remaining =
                    String(minutes)
                    .padStart(2, "0")
                    +
                    ":" +
                    String(secs)
                    .padStart(2, "0");
            }
        }


        const statusClass =
            vehicle.status === "OCCUPIED"
                ? "occupied"
                : "available";


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${escapeHTML(
                    vehicle.qr_id
                )}
            </td>

            <td>
                ${escapeHTML(
                    vehicle.owner_name
                )}
            </td>

            <td>
                ${escapeHTML(
                    vehicle.car_number
                )}
            </td>

            <td>
                Slot ${escapeHTML(
                    String(
                        vehicle.slot_number
                    )
                )}
            </td>

            <td class="${statusClass}">
                ${escapeHTML(
                    vehicle.status
                )}
            </td>

            <td class="${timeClass}">
                ${remaining}
            </td>

        `;


        table.appendChild(row);

    });

}


/* =====================================================
   LOAD NOTIFICATIONS
===================================================== */

async function loadNotifications() {

    const table =
        document.getElementById(
            "notificationsTableBody"
        );


    const result =
        await db
        .from("notifications")
        .select(
            "id,qr_id,car_number,message,status,created_at"
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (result.error) {

        console.error(
            "NOTIFICATION ERROR:",
            result.error
        );

        table.innerHTML = `
            <tr>
                <td colspan="6">
                    ❌ ${escapeHTML(
                        result.error.message
                    )}
                </td>
            </tr>
        `;

        return;
    }


    const notifications =
        result.data || [];


    if (notifications.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="6">
                    No notifications yet.
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML = "";


    notifications.forEach(
        function(notification) {

            const row =
                document.createElement("tr");


            if (
                notification.status &&
                notification.status.toUpperCase()
                === "NEW"
            ) {

                row.classList.add(
                    "notification-new"
                );
            }


            let time = "--";


            if (
                notification.created_at
            ) {

                time =
                    new Date(
                        notification.created_at
                    ).toLocaleString();

            }


            row.innerHTML = `

                <td>
                    ${escapeHTML(
                        String(
                            notification.id
                        )
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        notification.qr_id || ""
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        notification.car_number || ""
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        notification.message || ""
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        notification.status || ""
                    )}
                </td>

                <td>
                    ${escapeHTML(time)}
                </td>

            `;


            table.appendChild(row);

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}

</script>

</body>
</html>
