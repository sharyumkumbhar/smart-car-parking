<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parking Operator Dashboard</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f4f7;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #222;
    }

    h2 {
        color: #333;
        margin-top: 0;
    }

    .container {
        max-width: 1100px;
        margin: auto;
    }

    .card {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    input, select {
        width: 100%;
        padding: 12px;
        margin: 7px 0 12px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    button {
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin: 4px;
        font-size: 14px;
    }

    .register-btn {
        background: #1976d2;
        color: white;
        width: 100%;
        margin: 0;
    }

    .release-btn {
        background: #d32f2f;
        color: white;
    }

    .sms-btn {
        background: #388e3c;
        color: white;
    }

    .allot-btn {
        background: #7b1fa2;
        color: white;
    }

    .refresh-btn {
        background: #555;
        color: white;
    }

    .vehicle {
        border: 1px solid #ddd;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 12px;
        background: #fafafa;
    }

    .occupied {
        border-left: 6px solid #d32f2f;
    }

    .available {
        border-left: 6px solid #2e7d32;
    }

    .notification {
        border: 1px solid #ddd;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 10px;
        background: #fff;
    }

    .new {
        border-left: 5px solid #ff9800;
    }

    .message {
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 6px;
        display: none;
    }

    .success {
        background: #d4edda;
        color: #155724;
    }

    .error {
        background: #f8d7da;
        color: #721c24;
    }

    .countdown {
        font-weight: bold;
        color: #d32f2f;
    }

    .slot-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin-top: 15px;
    }

    .slot {
        padding: 15px;
        text-align: center;
        border-radius: 8px;
        font-weight: bold;
    }

    .slot-free {
        background: #c8e6c9;
        color: #1b5e20;
    }

    .slot-busy {
        background: #ffcdd2;
        color: #b71c1c;
    }

    @media(max-width:700px) {
        .slot-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
</head>

<body>

<div class="container">

<h1>🚗 Smart Parking Operator Dashboard</h1>

<div id="message" class="message"></div>


<!-- VEHICLE REGISTRATION -->

<div class="card">

<h2>🚘 Vehicle Registration</h2>

<label>QR ID</label>
<input type="text" id="qr_id" placeholder="Example: QR001">

<label>Owner Name</label>
<input type="text" id="owner_name" placeholder="Owner name">

<label>Car Number</label>
<input type="text" id="car_number" placeholder="Example: GA 01 AB 1234">

<label>Phone Number</label>
<input type="text" id="phone_number" placeholder="+919876543210">

<label>Parking Time (minutes)</label>
<input type="number" id="parking_time" placeholder="Example: 30">

<label>Slot Number</label>

<select id="slot_number">
    <option value="">Select Slot</option>
    <option value="1">Slot 1</option>
    <option value="2">Slot 2</option>
    <option value="3">Slot 3</option>
    <option value="4">Slot 4</option>
    <option value="5">Slot 5</option>
</select>

<label>Status</label>

<select id="status">
    <option value="">Select Status</option>
    <option value="OCCUPIED">OCCUPIED</option>
</select>

<button class="register-btn" onclick="registerVehicle()">
    ➕ Register Vehicle
</button>

</div>


<!-- SLOT STATUS -->

<div class="card">

<h2>🅿️ Parking Slot Status</h2>

<div id="slotStatus" class="slot-grid">
    Loading...
</div>

</div>


<!-- REGISTERED VEHICLES -->

<div class="card">

<h2>🚙 Registered Vehicles</h2>

<button class="refresh-btn" onclick="loadVehicles()">
    🔄 Refresh Vehicles
</button>

<div id="vehicles">
    Loading...
</div>

</div>


<!-- NOTIFICATIONS -->

<div class="card">

<h2>🔔 Customer Notifications</h2>

<button class="refresh-btn" onclick="loadNotifications()">
    🔄 Refresh Notifications
</button>

<div id="notifications">
    Loading...
</div>

</div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// =====================================================
// SUPABASE CONNECTION
// =====================================================

const SUPABASE_URL = "https://yokdshtjbjlhqmmrnpxh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2ZDoGT6xIclKRzqbE78Vnw_Uwp7BRdK";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text, type) {

    const box = document.getElementById("message");

    box.innerText = text;

    box.className = "message " + type;

    box.style.display = "block";

    setTimeout(() => {
        box.style.display = "none";
    }, 4000);
}


// =====================================================
// REGISTER VEHICLE
// =====================================================

async function registerVehicle() {

    const qr_id =
        document.getElementById("qr_id").value.trim();

    const owner_name =
        document.getElementById("owner_name").value.trim();

    const car_number =
        document.getElementById("car_number").value.trim();

    const phone_number =
        document.getElementById("phone_number").value.trim();

    const parking_time =
        Number(document.getElementById("parking_time").value);

    const slot_number =
        Number(document.getElementById("slot_number").value);

    const status =
        document.getElementById("status").value;


    // -----------------------------
    // VALIDATION
    // -----------------------------

    if (!qr_id) {
        showMessage("Please enter QR ID.", "error");
        return;
    }

    if (!owner_name) {
        showMessage("Please enter owner name.", "error");
        return;
    }

    if (!car_number) {
        showMessage("Please enter car number.", "error");
        return;
    }

    if (!phone_number) {
        showMessage("Please enter phone number.", "error");
        return;
    }

    if (!parking_time || parking_time <= 0) {
        showMessage("Please enter valid parking time.", "error");
        return;
    }

    if (!slot_number || slot_number < 1 || slot_number > 5) {
        showMessage("Please select a valid slot.", "error");
        return;
    }

    if (status !== "OCCUPIED") {
        showMessage("Please select OCCUPIED status.", "error");
        return;
    }


    // =================================================
    // CHECK DUPLICATE QR
    // =================================================

    const { data: existingQR, error: qrError } =
        await db
        .from("cars")
        .select("QR_ID")
        .eq("QR_ID", qr_id);

    if (qrError) {

        console.error(qrError);

        showMessage(
            "Error checking QR ID: " + qrError.message,
            "error"
        );

        return;
    }

    if (existingQR && existingQR.length > 0) {

        showMessage(
            "This QR ID is already registered.",
            "error"
        );

        return;
    }


    // =================================================
    // CHECK SLOT
    // =================================================

    const { data: occupiedSlot, error: slotError } =
        await db
        .from("cars")
        .select("QR_ID,CAR_NUMBER")
        .eq("SLOT_NUMBER", slot_number)
        .eq("STATUS", "OCCUPIED");

    if (slotError) {

        console.error(slotError);

        showMessage(
            "Error checking slot: " + slotError.message,
            "error"
        );

        return;
    }

    if (occupiedSlot && occupiedSlot.length > 0) {

        showMessage(
            "Slot " + slot_number + " is already occupied.",
            "error"
        );

        return;
    }


    // =================================================
    // PARKING TIME
    // =================================================

    const parking_start = new Date();

    const parking_end =
        new Date(
            parking_start.getTime() +
            parking_time * 60 * 1000
        );


    // =================================================
    // INSERT VEHICLE
    // =================================================

    const { error: insertError } =
        await db
        .from("cars")
        .insert([{

            QR_ID: qr_id,

            OWNER_NAME: owner_name,

            CAR_NUMBER: car_number,

            PHONE_NUMBER: phone_number,

            PARKING_TIME: parking_time,

            STATUS: "OCCUPIED",

            PARK: "YES",

            parking_start:
                parking_start.toISOString(),

            parking_end:
                parking_end.toISOString(),

            SLOT_NUMBER: slot_number

        }]);


    if (insertError) {

        console.error(insertError);

        showMessage(
            "Registration failed: " +
            insertError.message,
            "error"
        );

        return;
    }


    // =================================================
    // SUCCESS
    // =================================================

    showMessage(
        "Vehicle registered successfully!",
        "success"
    );


    // =================================================
    // CLEAR FORM
    // =================================================

    document.getElementById("qr_id").value = "";
    document.getElementById("owner_name").value = "";
    document.getElementById("car_number").value = "";
    document.getElementById("phone_number").value = "";
    document.getElementById("parking_time").value = "";
    document.getElementById("slot_number").value = "";
    document.getElementById("status").value = "";


    // =================================================
    // REFRESH
    // =================================================

    await loadVehicles();

    await loadSlotStatus();

}


// =====================================================
// LOAD VEHICLES
// =====================================================

async function loadVehicles() {

    const container =
        document.getElementById("vehicles");

    container.innerHTML = "Loading...";


    const { data, error } =
        await db
        .from("cars")
        .select(`
            QR_ID,
            OWNER_NAME,
            CAR_NUMBER,
            PHONE_NUMBER,
            PARKING_TIME,
            STATUS,
            PARK,
            parking_start,
            parking_end,
            SLOT_NUMBER
        `)
        .order("parking_start", {
            ascending: false
        });


    if (error) {

        console.error(error);

        container.innerHTML =
            "Error loading vehicles: " +
            error.message;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>No vehicles registered.</p>";

        await loadSlotStatus();

        return;
    }


    container.innerHTML = "";


    data.forEach(vehicle => {

        const div =
            document.createElement("div");

        div.className =
            "vehicle " +
            (
                vehicle.STATUS === "OCCUPIED"
                ? "occupied"
                : "available"
            );


        // =================================================
        // BUTTONS
        // =================================================

        let buttons = "";


        // -------------------------------------------------
        // EXPIRY SMS BUTTON
        // ONLY OCCUPIED VEHICLES GET THIS BUTTON
        // -------------------------------------------------

        if (vehicle.STATUS === "OCCUPIED") {

            buttons += `
                <button
                    class="sms-btn"
                    onclick='createExpirySMSCommand(${JSON.stringify(vehicle)})'>
                    📱 Create Expiry SMS
                </button>
            `;

        }


        // -------------------------------------------------
        // RELEASE BUTTON
        // ONLY OCCUPIED VEHICLES
        // -------------------------------------------------

        if (vehicle.STATUS === "OCCUPIED") {

            buttons += `
                <button
                    class="release-btn"
                    onclick='releaseVehicle("${vehicle.QR_ID}")'>
                    🚪 Release Vehicle
                </button>
            `;

        }


        // -------------------------------------------------
        // ALLOT COMMAND
        // -------------------------------------------------

        if (vehicle.STATUS === "OCCUPIED") {

            buttons += `
                <button
                    class="allot-btn"
                    onclick='createArduinoCommandFromQR("${vehicle.QR_ID}")'>
                    📡 Create Arduino Command
                </button>
            `;

        }


        // =================================================
        // COUNTDOWN
        // =================================================

        let countdownHTML = "";

        if (
            vehicle.STATUS === "OCCUPIED" &&
            vehicle.parking_end
        ) {

            countdownHTML = `
                <p>
                    ⏱️ Remaining:
                    <span
                        class="countdown"
                        id="countdown-${vehicle.QR_ID}">
                        Calculating...
                    </span>
                </p>
            `;

        }


        // =================================================
        // DISPLAY
        // =================================================

        div.innerHTML = `

            <h3>
                🚗 ${vehicle.CAR_NUMBER}
            </h3>

            <p>
                <b>QR ID:</b>
                ${vehicle.QR_ID}
            </p>

            <p>
                <b>Owner:</b>
                ${vehicle.OWNER_NAME}
            </p>

            <p>
                <b>Phone:</b>
                ${vehicle.PHONE_NUMBER}
            </p>

            <p>
                <b>Slot:</b>
                ${vehicle.SLOT_NUMBER}
            </p>

            <p>
                <b>Parking Time:</b>
                ${vehicle.PARKING_TIME} minutes
            </p>

            <p>
                <b>Status:</b>
                ${vehicle.STATUS}
            </p>

            ${countdownHTML}

            <div>
                ${buttons}
            </div>
        `;


        container.appendChild(div);


        // =================================================
        // START COUNTDOWN
        // =================================================

        if (
            vehicle.STATUS === "OCCUPIED" &&
            vehicle.parking_end
        ) {

            updateCountdown(
                vehicle.QR_ID,
                vehicle.parking_end
            );

        }

    });


    await loadSlotStatus();
}


// =====================================================
// COUNTDOWN
// =====================================================

function updateCountdown(qrId, endTime) {

    const element =
        document.getElementById(
            "countdown-" + qrId
        );

    if (!element) return;


    function update() {

        const now =
            new Date().getTime();

        const end =
            new Date(endTime).getTime();

        const difference =
            end - now;


        if (difference <= 0) {

            element.innerText =
                "EXPIRED";

            element.style.color =
                "#b71c1c";

            return;
        }


        const totalSeconds =
            Math.floor(
                difference / 1000
            );

        const minutes =
            Math.floor(
                totalSeconds / 60
            );

        const seconds =
            totalSeconds % 60;


        element.innerText =
            minutes +
            " min " +
            seconds +
            " sec";


        setTimeout(update, 1000);
    }


    update();
}


// =====================================================
// RELEASE VEHICLE
// =====================================================

async function releaseVehicle(qrId) {

    const confirmRelease =
        confirm(
            "Release this vehicle?"
        );

    if (!confirmRelease) {
        return;
    }


    const { error } =
        await db
        .from("cars")
        .update({

            STATUS: "AVAILABLE",

            PARK: "NO"

        })
        .eq("QR_ID", qrId);


    if (error) {

        console.error(error);

        showMessage(
            "Release failed: " +
            error.message,
            "error"
        );

        return;
    }


    // =================================================
    // SUCCESS
    // =================================================

    showMessage(
        "Vehicle released successfully!",
        "success"
    );


    // =================================================
    // IMPORTANT:
    // RELOAD VEHICLES
    // THIS REMOVES THE EXPIRY SMS BUTTON
    // =================================================

    await loadVehicles();

    await loadSlotStatus();
}


// =====================================================
// CREATE EXPIRY SMS COMMAND
// =====================================================

function createExpirySMSCommand(vehicle) {

    const phone =
        vehicle.PHONE_NUMBER;

    const carNumber =
        vehicle.CAR_NUMBER;


    const message =
        "Your parking time for car " +
        carNumber +
        " is about to expire, please move your car or contact the parking office.";


    const command =
        "SMS|" +
        phone +
        "|" +
        message;


    // Copy command

    navigator.clipboard.writeText(command)
        .then(() => {

            alert(
                "SMS command copied!\n\n" +
                command
            );

        })
        .catch(() => {

            prompt(
                "Copy this SMS command:",
                command
            );

        });
}


// =====================================================
// CREATE ARDUINO COMMAND
// =====================================================

async function createArduinoCommandFromQR(qrId) {

    const { data, error } =
        await db
        .from("cars")
        .select(`
            QR_ID,
            SLOT_NUMBER,
            PARKING_TIME,
            PHONE_NUMBER
        `)
        .eq("QR_ID", qrId)
        .single();


    if (error) {

        alert(
            "Error: " +
            error.message
        );

        return;
    }


    const command =
        "ALLOT," +
        data.QR_ID +
        "," +
        data.SLOT_NUMBER +
        "," +
        data.PARKING_TIME +
        "," +
        data.PHONE_NUMBER;


    navigator.clipboard.writeText(command)
        .then(() => {

            alert(
                "Arduino command copied:\n\n" +
                command
            );

        })
        .catch(() => {

            prompt(
                "Copy this Arduino command:",
                command
            );

        });
}


// =====================================================
// LOAD SLOT STATUS
// =====================================================

async function loadSlotStatus() {

    const container =
        document.getElementById(
            "slotStatus"
        );


    const { data, error } =
        await db
        .from("cars")
        .select(
            "SLOT_NUMBER,STATUS,CAR_NUMBER"
        )
        .eq("STATUS", "OCCUPIED");


    if (error) {

        container.innerHTML =
            "Error loading slot status.";

        return;
    }


    container.innerHTML = "";


    for (
        let slot = 1;
        slot <= 5;
        slot++
    ) {

        const occupiedVehicle =
            data.find(
                vehicle =>
                    Number(
                        vehicle.SLOT_NUMBER
                    ) === slot
            );


        const div =
            document.createElement("div");


        if (occupiedVehicle) {

            div.className =
                "slot slot-busy";

            div.innerHTML = `
                🔴 Slot ${slot}
                <br>
                OCCUPIED
                <br>
                ${occupiedVehicle.CAR_NUMBER}
            `;

        } else {

            div.className =
                "slot slot-free";

            div.innerHTML = `
                🟢 Slot ${slot}
                <br>
                AVAILABLE
            `;

        }


        container.appendChild(div);
    }
}


// =====================================================
// LOAD NOTIFICATIONS
// =====================================================

async function loadNotifications() {

    const container =
        document.getElementById(
            "notifications"
        );


    container.innerHTML =
        "Loading...";


    const { data, error } =
        await db
        .from("notifications")
        .select(`
            id,
            created_at,
            qr_id,
            car_number,
            message,
            status
        `)
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML =
            "Error loading notifications: " +
            error.message;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>No notifications.</p>";

        return;
    }


    container.innerHTML = "";


    data.forEach(notification => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "notification " +
            (
                notification.status === "NEW"
                ? "new"
                : ""
            );


        const date =
            new Date(
                notification.created_at
            ).toLocaleString();


        div.innerHTML = `

            <p>
                <b>🚗 Car:</b>
                ${notification.car_number}
            </p>

            <p>
                <b>QR ID:</b>
                ${notification.qr_id}
            </p>

            <p>
                <b>Message:</b>
                ${notification.message}
            </p>

            <p>
                <b>Status:</b>
                ${notification.status}
            </p>

            <p>
                <b>Time:</b>
                ${date}
            </p>

        `;


        container.appendChild(div);

    });
}


// =====================================================
// AUTO REFRESH
// =====================================================

setInterval(
    loadNotifications,
    5000
);

setInterval(
    loadVehicles,
    10000
);


// =====================================================
// INITIAL LOAD
// =====================================================

loadVehicles();

loadNotifications();

loadSlotStatus();

</script>

</body>
</html>
