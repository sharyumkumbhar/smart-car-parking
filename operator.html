<script>

/* =========================================================
   SUPABASE CONNECTION
   ========================================================= */

const SUPABASE_URL = "https://yokdshtjbjlhqmmrnpxh.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_2ZDoGT6xIclKRzqbE78Vnw_Uwp7BRdK";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   SHOW MESSAGE
   ========================================================= */

function showMessage(text, type) {

  const message = document.getElementById("message");

  message.textContent = text;

  message.className = "message " + type;

}


/* =========================================================
   REGISTER VEHICLE
   ========================================================= */

async function registerVehicle() {

  try {

    const qr_id =
      document.getElementById("qr_id").value.trim();

    const owner_name =
      document.getElementById("owner_name").value.trim();

    const car_number =
      document.getElementById("car_number").value.trim();

    const phone_number =
      document.getElementById("phone_number").value.trim();

    const parking_time =
      Number(document.getElementById("parking_time").value);

    const slot_number =
      Number(document.getElementById("slot_number").value);

    const status =
      document.getElementById("status").value;


    /* VALIDATION */

    if (!qr_id) {

      showMessage("Please enter QR ID.", "error");

      return;

    }


    if (!owner_name) {

      showMessage("Please enter owner name.", "error");

      return;

    }


    if (!car_number) {

      showMessage("Please enter car number.", "error");

      return;

    }


    if (!phone_number) {

      showMessage("Please enter phone number.", "error");

      return;

    }


    if (!parking_time || parking_time <= 0) {

      showMessage("Please enter a valid parking time.", "error");

      return;

    }


    if (!slot_number || slot_number < 1 || slot_number > 5) {

      showMessage("Please select a parking slot.", "error");

      return;

    }


    /* BUTTON */

    const button =
      document.getElementById("registerButton");

    button.disabled = true;

    button.textContent = "Registering...";


    /* =====================================================
       CHECK DUPLICATE QR
       ===================================================== */

    const { data: existingQR, error: qrError } =
      await db
        .from("cars")
        .select("QR_ID")
        .eq("QR_ID", qr_id)
        .limit(1);


    if (qrError) {

      console.error(qrError);

      showMessage(
        "QR check failed: " + qrError.message,
        "error"
      );

      button.disabled = false;

      button.textContent = "🚗 Register Vehicle";

      return;

    }


    if (existingQR && existingQR.length > 0) {

      showMessage(
        "This QR ID is already registered.",
        "error"
      );

      button.disabled = false;

      button.textContent = "🚗 Register Vehicle";

      return;

    }


    /* =====================================================
       CHECK SLOT
       ===================================================== */

    const { data: existingSlot, error: slotError } =
      await db
        .from("cars")
        .select("QR_ID,CAR_NUMBER")
        .eq("SLOT_NUMBER", slot_number)
        .eq("STATUS", "OCCUPIED")
        .limit(1);


    if (slotError) {

      console.error(slotError);

      showMessage(
        "Slot check failed: " + slotError.message,
        "error"
      );

      button.disabled = false;

      button.textContent = "🚗 Register Vehicle";

      return;

    }


    if (existingSlot && existingSlot.length > 0) {

      showMessage(
        "Slot " + slot_number + " is already occupied.",
        "error"
      );

      button.disabled = false;

      button.textContent = "🚗 Register Vehicle";

      return;

    }


    /* =====================================================
       PARKING TIME
       
       Exhibition mode:
       1 minute = 1 second
       
       Therefore:
       parking_time * 1000
       ===================================================== */

    const parking_start = new Date();

    const parking_end = new Date(
      parking_start.getTime() +
      parking_time * 1000
    );


    /* =====================================================
       DATA TO DATABASE
       ===================================================== */

    const vehicleData = {

      QR_ID: qr_id,

      OWNER_NAME: owner_name,

      CAR_NUMBER: car_number,

      PHONE_NUMBER: phone_number,

      PARKING_TIME: parking_time,

      STATUS: status,

      SLOT_NUMBER: slot_number,

      parking_start:
        parking_start.toISOString(),

      parking_end:
        parking_end.toISOString()

    };


    console.log(
      "Sending vehicle data:",
      vehicleData
    );


    /* =====================================================
       INSERT
       ===================================================== */

    const { data, error } =
      await db
        .from("cars")
        .insert([vehicleData])
        .select();


    if (error) {

      console.error(
        "DATABASE INSERT ERROR:",
        error
      );

      showMessage(
        "Registration failed: " +
        error.message,
        "error"
      );

      button.disabled = false;

      button.textContent = "🚗 Register Vehicle";

      return;

    }


    /* =====================================================
       SUCCESS
       ===================================================== */

    showMessage(
      "✅ Vehicle registered successfully!",
      "success"
    );


    /* CLEAR FORM */

    document.getElementById("qr_id").value = "";

    document.getElementById("owner_name").value = "";

    document.getElementById("car_number").value = "";

    document.getElementById("phone_number").value = "";

    document.getElementById("parking_time").value = "";

    document.getElementById("slot_number").value = "";

    document.getElementById("status").value =
      "OCCUPIED";


    button.disabled = false;

    button.textContent = "🚗 Register Vehicle";


    /* REFRESH VEHICLES */

    loadVehicles();

  }

  catch (error) {

    console.error(
      "Unexpected error:",
      error
    );

    showMessage(
      "Unexpected error: " + error.message,
      "error"
    );

    const button =
      document.getElementById("registerButton");

    button.disabled = false;

    button.textContent = "🚗 Register Vehicle";

  }

}


/* =========================================================
   LOAD REGISTERED VEHICLES
   ========================================================= */

async function loadVehicles() {

  const container =
    document.getElementById("vehicles");

  container.innerHTML =
    '<div class="empty">Loading...</div>';


  const { data, error } =
    await db
      .from("cars")
      .select(
        "QR_ID,OWNER_NAME,CAR_NUMBER,PHONE_NUMBER,PARKING_TIME,STATUS,SLOT_NUMBER,parking_start,parking_end"
      )
      .order(
        "parking_start",
        { ascending: false }
      );


  if (error) {

    console.error(error);

    container.innerHTML =
      '<div class="empty">Failed to load vehicles.</div>';

    return;

  }


  if (!data || data.length === 0) {

    container.innerHTML =
      '<div class="empty">No vehicles registered.</div>';

    return;

  }


  container.innerHTML = "";


  data.forEach(vehicle => {

    const div =
      document.createElement("div");

    div.className = "vehicle";


    div.innerHTML = `

      <div class="vehicle-header">

        <h3>
          🚗 ${escapeHTML(vehicle.CAR_NUMBER || "Unknown")}
        </h3>

        <span class="status ${
          vehicle.STATUS === "OCCUPIED"
            ? "occupied"
            : "available"
        }">

          ${escapeHTML(vehicle.STATUS || "")}

        </span>

      </div>


      <p>
        <b>QR ID:</b>
        ${escapeHTML(vehicle.QR_ID || "")}
      </p>


      <p>
        <b>Owner:</b>
        ${escapeHTML(vehicle.OWNER_NAME || "")}
      </p>


      <p>
        <b>Phone:</b>
        ${escapeHTML(vehicle.PHONE_NUMBER || "")}
      </p>


      <p>
        <b>Slot:</b>
        ${escapeHTML(String(vehicle.SLOT_NUMBER || ""))}
      </p>


      <p>
        <b>Parking Time:</b>
        ${escapeHTML(String(vehicle.PARKING_TIME || ""))}
        minutes
      </p>


      <div
        class="countdown"
        id="timer-${escapeHTML(vehicle.QR_ID)}"
      >
        Calculating...
      </div>


      ${
        vehicle.STATUS === "OCCUPIED"
        ?
        `
        <button
          class="release-btn"
          onclick="releaseVehicle('${escapeJS(vehicle.QR_ID)}')"
        >
          🚪 Release Vehicle
        </button>
        `
        :
        ""
      }

    `;


    container.appendChild(div);


    updateCountdown(

      vehicle.QR_ID,

      vehicle.parking_end

    );

  });

}


/* =========================================================
   COUNTDOWN
   ========================================================= */

function updateCountdown(qr_id, parking_end) {

  const timer =
    document.getElementById(
      "timer-" + qr_id
    );


  if (!timer) return;


  function update() {

    if (!parking_end) {

      timer.textContent =
        "No parking time";

      return;

    }


    const end =
      new Date(parking_end).getTime();

    const now =
      new Date().getTime();

    const difference =
      end - now;


    if (difference <= 0) {

      timer.textContent =
        "⏰ PARKING TIME EXPIRED";

      timer.className =
        "countdown expired";

      return;

    }


    const seconds =
      Math.floor(difference / 1000);


    const minutes =
      Math.floor(seconds / 60);


    const remainingSeconds =
      seconds % 60;


    timer.textContent =
      "⏳ Remaining: " +
      minutes +
      "m " +
      remainingSeconds +
      "s";

  }


  update();


  setInterval(
    update,
    1000
  );

}


/* =========================================================
   RELEASE VEHICLE
   ========================================================= */

async function releaseVehicle(qr_id) {

  if (
    !confirm(
      "Release this vehicle?"
    )
  ) {

    return;

  }


  const { error } =
    await db
      .from("cars")
      .update({

        STATUS: "AVAILABLE"

      })
      .eq(
        "QR_ID",
        qr_id
      );


  if (error) {

    console.error(error);

    alert(
      "Failed to release vehicle: " +
      error.message
    );

    return;

  }


  alert(
    "✅ Vehicle released successfully."
  );


  loadVehicles();

}


/* =========================================================
   LOAD NOTIFICATIONS
   ========================================================= */

async function loadNotifications() {

  const container =
    document.getElementById(
      "notifications"
    );


  container.innerHTML =
    '<div class="empty">Loading...</div>';


  const { data, error } =
    await db
      .from("notifications")
      .select(
        "id,qr_id,car_number,message,status,created_at"
      )
      .order(
        "created_at",
        { ascending: false }
      )
      .limit(30);


  if (error) {

    console.error(error);

    container.innerHTML =
      '<div class="empty">Failed to load notifications.</div>';

    return;

  }


  if (!data || data.length === 0) {

    container.innerHTML =
      '<div class="empty">No notifications yet.</div>';

    return;

  }


  container.innerHTML = "";


  data.forEach(notification => {

    const div =
      document.createElement("div");

    div.className =
      "notification";


    div.innerHTML = `

      <b>🔔 QR ID:</b>
      ${escapeHTML(notification.qr_id || "")}

      <br>

      <b>🚗 Car:</b>
      ${escapeHTML(notification.car_number || "")}

      <br><br>

      ${escapeHTML(notification.message || "")}

      <br><br>

      <small>
        ${formatDate(notification.created_at)}
      </small>

    `;


    container.appendChild(div);

  });

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

  return String(value ?? "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =========================================================
   ESCAPE JAVASCRIPT STRING
   ========================================================= */

function escapeJS(value) {

  return String(value ?? "")

    .replace(/\\/g, "\\\\")

    .replace(/'/g, "\\'")

    .replace(/"/g, '\\"');

}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(date) {

  if (!date) return "";

  return new Date(date)
    .toLocaleString();

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadVehicles();

    loadNotifications();

  }
);


/* =========================================================
   AUTO REFRESH NOTIFICATIONS
   ========================================================= */

setInterval(
  loadNotifications,
  5000
);


/* =========================================================
   AUTO REFRESH VEHICLES
   ========================================================= */

setInterval(
  loadVehicles,
  10000
);

</script>

</body>
</html>
