<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Smart Parking - Operator Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {

}

header h1 {
    margin: 0;

}

.container {

    margin: auto;

.card {

.refresh-btn {

.vehicle.occupied {

.status {

}

.countdown {

    font-weight: bold;

.release-btn {

.command-btn {

    color: white;

}

.sms-btn {

}

.copy-btn {

.command-box {
    display: none;

<script>

/* =====================================================
   SUPABASE INITIALIZATION
   ===================================================== */

const SUPABASE_URL =
    "https://yokdshtjbjlhqmmrnpxh.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_2ZDoGT6xIclKRzqbE78Vnw_Uwp7BRdK";


/*
   IMPORTANT:

   db MUST be created before any function
   that uses db.
*/

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   SHOW MESSAGE
   ===================================================== */

function showMessage(
    elementId,
    text,
    type
) {

    const element =
        document.getElementById(
            elementId
        );

    element.textContent =
        text;

    element.className =
        "message " + type;

    element.style.display =
        "block";
}



/* =====================================================
   REGISTER VEHICLE
   ===================================================== */

async function registerVehicle() {

    try {

        const qr_id =
            document
                .getElementById("qr_id")
                .value
                .trim();

        const owner_name =
            document
                .getElementById("owner_name")
                .value
                .trim();

        const car_number =
            document
                .getElementById("car_number")
                .value
                .trim();

        const phone_number =
            document
                .getElementById("phone_number")
                .value
                .trim();

        const parking_time =
            Number(
                document
                    .getElementById("parking_time")
                    .value
            );

        const slot_number =
            Number(
                document
                    .getElementById("slot_number")
                    .value
            );

        const status =
            document
                .getElementById("status")
                .value;


        /* VALIDATION */

        if (!qr_id) {
            showMessage(
                "registerMessage",
                "Please enter QR ID.",
                "error"
            );
            return;
        }

        if (!owner_name) {
            showMessage(
                "registerMessage",
                "Please enter owner name.",
                "error"
            );
            return;
        }

        if (!car_number) {
            showMessage(
                "registerMessage",
                "Please enter car number.",
                "error"
            );
            return;
        }

        if (!phone_number) {
            showMessage(
                "registerMessage",
                "Please enter phone number.",
                "error"
            );
            return;
        }

        if (
            !parking_time ||
            parking_time <= 0
        ) {
            showMessage(
                "registerMessage",
                "Please enter valid parking time.",
                "error"
            );
            return;
        }

        if (
            slot_number < 1 ||
            slot_number > 5
        ) {
            showMessage(
                "registerMessage",
                "Please select a valid slot.",
                "error"
            );
            return;
        }

        if (!status) {
            showMessage(
                "registerMessage",
                "Please select status.",
                "error"
            );
            return;
        }


        /* CHECK DUPLICATE QR */

        const {
            data: existingQR,
            error: qrError
        } = await db
            .from("cars")
            .select("QR_ID")
            .eq(
                "QR_ID",
                qr_id
            );


        if (qrError) {

            console.error(qrError);

            showMessage(
                "registerMessage",
                "QR check failed: " +
                qrError.message,
                "error"
            );

            return;
        }


        if (
            existingQR &&
            existingQR.length > 0
        ) {

            showMessage(
                "registerMessage",
                "This QR ID is already registered.",
                "error"
            );

            return;
        }


        /* CHECK SLOT */

        const {
            data: occupiedSlot,
            error: slotError
        } = await db
            .from("cars")
            .select(
                "QR_ID,CAR_NUMBER"
            )
            .eq(
                "SLOT_NUMBER",
                slot_number
            )
            .eq(
                "STATUS",
                "OCCUPIED"
            );


        if (slotError) {

            console.error(slotError);

            showMessage(
                "registerMessage",
                "Slot check failed: " +
                slotError.message,
                "error"
            );

            return;
        }


        if (
            occupiedSlot &&
            occupiedSlot.length > 0
        ) {

            showMessage(
                "registerMessage",
                "Slot " +
                slot_number +
                " is already occupied.",
                "error"
            );

            return;
        }


        /* PARKING TIME */

        const parking_start =
            new Date();


        const parking_end =
            new Date(
                parking_start.getTime() +
                parking_time *
                60 *
                1000
            );


        /* INSERT */

        const {
            error
        } = await db
            .from("cars")
            .insert([{

                QR_ID:
                    qr_id,

                OWNER_NAME:
                    owner_name,

                CAR_NUMBER:
                    car_number,

                PHONE_NUMBER:
                    phone_number,

                PARKING_TIME:
                    parking_time,

                STATUS:
                    "OCCUPIED",

                PARK:
                    "YES",

                parking_start:
                    parking_start.toISOString(),

                parking_end:
                    parking_end.toISOString(),

                SLOT_NUMBER:
                    slot_number

            }]);


        if (error) {

            console.error(error);

            showMessage(
                "registerMessage",
                "Registration failed: " +
                error.message,
                "error"
            );

            return;
        }


        showMessage(
            "registerMessage",
            "✅ Vehicle registered successfully!",
            "success"
        );


        /* CLEAR FORM */

        document
            .getElementById("qr_id")
            .value = "";

        document
            .getElementById("owner_name")
            .value = "";

        document
            .getElementById("car_number")
            .value = "";

        document
            .getElementById("phone_number")
            .value = "";

        document
            .getElementById("parking_time")
            .value = "";

        document
            .getElementById("slot_number")
            .value = "";

        document
            .getElementById("status")
            .value = "";


        loadVehicles();

        loadSlotStatus();

    }

    catch (error) {

        console.error(error);

        showMessage(
            "registerMessage",
            "Unexpected error: " +
            error.message,
            "error"
        );

    }

}



/* =====================================================
   LOAD VEHICLES
   ===================================================== */

async function loadVehicles() {

    const container =
        document.getElementById(
            "vehicles"
        );

    container.innerHTML =
        "Loading vehicles...";


    try {

        const {
            data,
            error
        } = await db

            .from("cars")

            .select(`
                QR_ID,
                OWNER_NAME,
                CAR_NUMBER,
                PHONE_NUMBER,
                PARKING_TIME,
                STATUS,
                PARK,
                parking_start,
                parking_end,
                SLOT_NUMBER
            `)

            .order(
                "parking_start",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(error);

            container.innerHTML =
                "<p>❌ " +
                escapeHTML(
                    error.message
                ) +
                "</p>";

            return;
        }


        if (
            !data ||
            data.length === 0
        ) {

            container.innerHTML =
                "<p>No vehicles registered.</p>";

            loadSlotStatus();

            return;
        }


        container.innerHTML =
            "";


        data.forEach(vehicle => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "vehicle " +
                (
                    vehicle.STATUS ===
                    "OCCUPIED"
                    ?
                    "occupied"
                    :
                    "available"
                );


            div.innerHTML = `

                <strong>QR ID:</strong>
                ${escapeHTML(vehicle.QR_ID)}
                <br>

                <strong>Owner:</strong>
                ${escapeHTML(vehicle.OWNER_NAME)}
                <br>

                <strong>Car:</strong>
                ${escapeHTML(vehicle.CAR_NUMBER)}
                <br>

                <strong>Phone:</strong>
                ${escapeHTML(vehicle.PHONE_NUMBER)}
                <br>

                <strong>Slot:</strong>
                ${vehicle.SLOT_NUMBER}
                <br>

                <strong>Parking Time:</strong>
                ${vehicle.PARKING_TIME}
                minutes
                <br>

                <strong>Status:</strong>
                <span class="status">
                    ${escapeHTML(vehicle.STATUS)}
                </span>

                <div
                    class="countdown"
                    id="countdown-${escapeAttribute(vehicle.QR_ID)}"
                >
                    Loading...
                </div>

                ${
                    vehicle.STATUS ===
                    "OCCUPIED"
                    ?
                    `

                    <button
                        class="sms-btn"
                        onclick='createExpiryCommand(${JSON.stringify(vehicle)})'
                    >
                        📱 Create Expiry SMS
                    </button>

                    <button
                        class="release-btn"
                        onclick="releaseVehicle('${escapeAttribute(vehicle.QR_ID)}')"
                    >
                        🚪 Release Vehicle
                    </button>

                    `
                    :
                    ""
                }

            `;


            container.appendChild(
                div
            );


            updateCountdown(
                vehicle
            );

        });


        loadSlotStatus();

    }

    catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>❌ Unexpected error: " +
            escapeHTML(
                error.message
            ) +
            "</p>";

    }

}



/* =====================================================
   COUNTDOWN
   ===================================================== */

function updateCountdown(
    vehicle
) {

    const element =
        document.getElementById(
            "countdown-" +
            escapeAttribute(
                vehicle.QR_ID
            )
        );


    if (!element) {
        return;
    }


    if (
        !vehicle.parking_end ||
        vehicle.STATUS !== "OCCUPIED"
    ) {

        element.textContent =
            "No active parking";

        return;
    }


    function tick() {

        const end =
            new Date(
                vehicle.parking_end
            ).getTime();


        const now =
            Date.now();


        const remaining =
            end - now;


        if (
            remaining <= 0
        ) {

            element.textContent =
                "⏰ Parking time expired";

            return;
        }


        const totalSeconds =
            Math.floor(
                remaining /
                1000
            );


        const hours =
            Math.floor(
                totalSeconds /
                3600
            );


        const minutes =
            Math.floor(
                (
                    totalSeconds %
                    3600
                ) / 60
            );


        const seconds =
            totalSeconds % 60;


        element.textContent =
            "⏱️ " +
            String(hours)
                .padStart(2, "0") +
            ":" +
            String(minutes)
                .padStart(2, "0") +
            ":" +
            String(seconds)
                .padStart(2, "0");

    }


    tick();


    setInterval(
        tick,
        1000
    );

}



/* =====================================================
   RELEASE VEHICLE
   ===================================================== */

async function releaseVehicle(
    qrId
) {

    if (
        !confirm(
            "Release vehicle with QR ID " +
            qrId +
            "?"
        )
    ) {
        return;
    }


    try {

        const {
            error
        } = await db

            .from("cars")

            .update({

                STATUS:
                    "AVAILABLE",

                PARK:
                    "NO"

            })

            .eq(
                "QR_ID",
                qrId
            );


        if (error) {

            alert(
                "Release failed: " +
                error.message
            );

            return;
        }


        alert(
            "✅ Vehicle released."
        );


        loadVehicles();

        loadSlotStatus();

    }

    catch (error) {

        console.error(error);

        alert(
            "Unexpected error: " +
            error.message
        );

    }

}



/* =====================================================
   SLOT STATUS
   ===================================================== */

async function loadSlotStatus() {

    const container =
        document.getElementById(
            "slotStatus"
        );


    try {

        const {
            data,
            error
        } = await db

            .from("cars")

            .select(
                "SLOT_NUMBER,QR_ID,CAR_NUMBER,STATUS"
            )

            .eq(
                "STATUS",
                "OCCUPIED"
            );


        if (error) {

            container.innerHTML =
                "❌ " +
                escapeHTML(
                    error.message
                );

            return;
        }


        const occupiedSlots = {};


        data.forEach(
            vehicle => {

                if (
                    vehicle.SLOT_NUMBER
                ) {

                    occupiedSlots[
                        vehicle.SLOT_NUMBER
                    ] = vehicle;

                }

            }
        );


        container.innerHTML =
            "";


        for (
            let slot = 1;
            slot <= 5;
            slot++
        ) {

            const vehicle =
                occupiedSlots[slot];


            const div =
                document.createElement(
                    "div"
                );


            if (vehicle) {

                div.className =
                    "slot slot-busy";

                div.innerHTML = `
                    🔴 Slot ${slot}<br>
                    OCCUPIED
                `;

            }

            else {

                div.className =
                    "slot slot-free";

                div.innerHTML = `
                    🟢 Slot ${slot}<br>
                    AVAILABLE
                `;

            }


            container.appendChild(
                div
            );

        }

    }

    catch (error) {

        console.error(error);

        container.innerHTML =
            "❌ " +
            escapeHTML(
                error.message
            );

    }

}



/* =====================================================
   LOAD NOTIFICATIONS

                );

            return;
        }


        if (
            !data ||
            data.length === 0
        ) {

            container.innerHTML =
                "<p>No notifications.</p>";

            return;
        }


        container.innerHTML =
            "";


        data.forEach(
            notification => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "notification";


                const date =
                    notification.created_at
                    ?
                    new Date(

                    <br>

                    <strong>Car:</strong>
                    ${escapeHTML(

                    )}
                    <br>

                    <strong>Message:</strong>
                    ${escapeHTML(
                        notification.message || "-"
                    )}
                    <br>

                    <strong>Status:</strong>
                    ${escapeHTML(
                        notification.status || "-"
                    )}
                    <br>

                    <small>
                        ${escapeHTML(date)}
                    </small>

                    <button

                        onclick="createArduinoCommandFromQR('${escapeAttribute(notification.qr_id)}')"

}



/* =====================================================
   CREATE NORMAL ARDUINO ALLOT COMMAND
   ===================================================== */

async function createArduinoCommandFromQR(
    qrId
) {

    try {

        const {
            data,
            error
        } = await db

            .from("cars")

            .select(`
                QR_ID,
                PHONE_NUMBER,
                PARKING_TIME,
                SLOT_NUMBER,
                STATUS
            `)

            .eq(
                "QR_ID",
                qrId
            )

            .maybeSingle();


        if (error) {

            alert(
                "Could not find vehicle: " +
                error.message
            );

            return;
        }


        if (!data) {

            alert(
                "Vehicle not found."
            );

            return;
        }


        const command =
            `ALLOT,${data.QR_ID},${data.SLOT_NUMBER},${data.PARKING_TIME},${data.PHONE_NUMBER}`;


        showCommand(
            command
        );

    }

    catch (error) {

        console.error(error);

        alert(
            "Unexpected error: " +
            error.message
        );

    }

}



/* =====================================================
   CREATE EXPIRY SMS COMMAND
   ===================================================== */

function createExpirySMSCommand(
    vehicle
) {

    const phone =
        vehicle.PHONE_NUMBER;

    const carNumber =
        vehicle.CAR_NUMBER;


    const message =
        `Your parking time for car ${carNumber} is about to expire, please move your car or contact the parking office.`;


    /*
       FORMAT:

       SMS|PHONE|MESSAGE
    */

    const command =
        `SMS|${phone}|${message}`;


    return command;

}



/* =====================================================
   CREATE EXPIRY COMMAND + COPY
   ===================================================== */

async function createExpiryCommand(
    vehicle
) {

    if (
        !vehicle.PHONE_NUMBER
    ) {

        alert(
            "Phone number is missing."
        );

        return;
    }


    if (
        !vehicle.CAR_NUMBER
    ) {

        alert(
            "Car number is missing."
        );

        return;
    }


    const command =
        createExpirySMSCommand(
            vehicle
        );


    showCommand(
        command
    );


    try {

        await navigator.clipboard.writeText(
            command
        );

        alert(
            "✅ Expiry SMS command created and copied!\n\n" +
            command
        );

    }

    catch (error) {

        alert(
            "✅ Expiry SMS command created!\n\n" +
            command
        );

    }

}



/* =====================================================
   SHOW COMMAND
   ===================================================== */

function showCommand(
    command
) {

    const box =
        document.getElementById(
            "arduinoCommandBox"
        );


    const textarea =
        document.getElementById(
            "arduinoCommand"
        );


    box.style.display =
        "block";


    textarea.value =
        command;


    textarea.focus();

}



/* =====================================================
   COPY COMMAND
   ===================================================== */

async function copyArduinoCommand() {

    const textarea =
        document.getElementById(
            "arduinoCommand"
        );


    const command =
        textarea.value;


    if (!command) {

        alert(
            "No command available."
        );

        return;
    }


    try {

        await navigator.clipboard.writeText(
            command
        );

        alert(
            "✅ Command copied!"
        );

    }

    catch (error) {

        textarea.select();

        document.execCommand(
            "copy"
        );

        alert(
            "✅ Command copied!"
        );

    }

}



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   ESCAPE ATTRIBUTE
   ===================================================== */

function escapeAttribute(
    value
) {

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        );

}

setInterval(
